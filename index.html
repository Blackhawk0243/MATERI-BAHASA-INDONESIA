                contextTitle: "Teks untuk soal nomor 8 s.d. 10",
                contextText: `<b>Teks 1</b>\nRhodamin B adalah zat pewarna yang tersedia di pasar untuk industri tekstil. Zat ini sering disalahgunakan sebagai zat pewarna makanan dan kosmetik di berbagai negara. Jenis makanan yang mengandung Rhodamin B di antaranya kerupuk, terasi, dan makanan ringan. Zat ini juga banyak ditemukan pada kembang gula, sirup, manisan, dawet, bubur, ikan asap, dan cendol. Tampilan makanan yang menggunakan zat ini cenderung menarik dan terkesan menawarkan cita rasa tinggi sehingga ketika harga jualnya tidak semahal tampilannya, banyak yang tertarik untuk membeli dan mengonsumsinya. Zat ini paling berbahaya bila dikonsumsi karena menyebabkan gangguan pada fungsi hati, bahkan kanker hati. Apabila mengonsumsi makanan yang mengandung Rhodamin B, dalam tubuh akan terjadi penumpukan lemak sehingga lama-kelamaan jumlahnya akan terus bertambah. Dampaknya baru akan kelihatan setelah puluhan tahun kemudian. Jika sudah masuk dalam tubuh, akan mengendap pada jaringan hati dan lemak, tidak dapat dikeluarkan, dan dalam jangka waktu lama bisa bersifat karsinogenik.\n\n<b>Teks 2</b>\nRhodamin B berbentuk serbuk kristal, berwarna hijau atau ungu kemerahan, tidak berbau, dan dalam larutan akan berwarna merah terang berpendar atau berfluoresensi. Rhodamin B merupakan zat warna golongan <i>xanthenes dyes</i>, dan digunakan pada industri tekstil dan kertas, sebagai pewarna kain, kosmetika, produk pembersih mulut, dan sabun. Rhodamin B memiliki berbagai nama lain, antara lain: Tetra ethyl rhodamin; Rheoninine B, D, & C; Red No. 19; Food Red 15; ADC Rhodamine B; Aizen Rhodamine; dan Brilliant Pink B. Rhodamin B mengandung senyawa klorin (Cl) yang merupakan senyawa halogen yang berbahaya dan reaktif. Jika tertelan, senyawa ini akan berusaha mencapai kestabilan dalam tubuh dengan cara mengikat senyawa lain dalam tubuh. Mengonsumsi bahan pangan yang mengandung Rhodamin B dalam jangka panjang dapat terakumulasi di dalam tubuh dan dapat menyebabkan gejala pembesaran hati dan ginjal, gangguan fungsi hati, kerusakan hati, gangguan fisiologis tubuh, bahkan dapat menyebabkan timbulnya kanker hati.`,

                contextTitle: "Dampak Ekonomi Digital terhadap Pertumbuhan Usaha Kecil dan Menengah (UKM)",
                contextText: `Ekonomi digital telah membawa perubahan besar dalam berbagai aspek bisnis, terutama bagi Usaha Kecil dan Menengah (UKM). Dengan adanya teknologi digital, UKM kini memiliki peluang lebih besar untuk berkembang dan bersaing di pasar yang lebih luas. Transformasi ini didorong oleh beberapa faktor utama, seperti perkembangan <i>e-commerce</i>, sistem pembayaran digital, pemasaran berbasis data, serta pemanfaatan teknologi berbasis kecerdasan buatan (<i>artificial intelligence</i>).\nSalah satu perubahan signifikan dalam ekonomi digital adalah kemudahan akses ke platform <i>e-commerce</i>. UKM yang sebelumnya hanya mengandalkan toko fisik kini dapat menjual produknya melalui berbagai <i>marketplace</i> daring. Hal ini memungkinkan mereka menjangkau konsumen di luar wilayah lokal, bahkan hingga ke pasar internasional. Dengan biaya operasional yang lebih rendah dibandingkan toko fisik, UKM dapat mengalokasikan dana untuk inovasi dan peningkatan kualitas produk. Selain itu, sistem pengiriman yang semakin efisien memungkinkan UKM memenuhi pesanan dengan lebih cepat dan tepat waktu.\nSelain akses pasar yang lebih luas, sistem pembayaran digital juga telah meningkatkan efisiensi transaksi keuangan. Penggunaan dompet digital dan pembayaran nontunai tidak hanya mempermudah konsumen dalam berbelanja, tetapi juga membantu UKM dalam mencatat keuangan secara lebih akurat. Keuntungan lain dari ekonomi digital adalah strategi pemasaran berbasis data. Melalui analisis data pelanggan, UKM dapat memahami tren pasar dan perilaku konsumen dengan lebih baik. Misalnya, penggunaan iklan digital yang ditargetkan memungkinkan UKM menjangkau segmen pasar yang lebih spesifik sehingga efektivitas promosi meningkat.\nMeskipun menawarkan banyak manfaat, transformasi digital juga menghadirkan tantangan. UKM harus mampu beradaptasi dengan perkembangan teknologi dan meningkatkan literasi digital agar tetap kompetitif. Selain itu, keamanan data menjadi aspek penting yang harus diperhatikan dalam menjalankan bisnis secara digital untuk menghindari risiko peretasan dan penyalahgunaan informasi pelanggan. Dengan segala peluang dan tantangannya, ekonomi digital telah menjadi faktor kunci dalam mendorong pertumbuhan UKM. Jika dikelola dengan baik, digitalisasi dapat menjadi pendorong utama bagi keberlanjutan dan daya saing usaha kecil di era modern ini.\n(Sumber: Kementerian Koperasi dan UKM Republik Indonesia)`,

                contextText: `Hampir 25 tahun lalu kami berpisah karena keluarga saya harus boyongan ke kota tempat kerja Ayah yang baru di luar pulau. Tak satupun barang tertinggal di rumah lama. Begitu juga dengan sahabatku, kami harus berpisah.\nBertemu dengannya setelah sekian lama, mengingatkan kembali pada pengalaman kami dahulu. Pengalaman yang menjadikan dia, walau tidak setiap waktu, selalu lekat di ingatan saya. Tentu dia mengingatnya pula, bahkan saya yakin rasa yang diidapnya lebih besar efeknya. Karena sebagai seorang sahabat, dia jelas jauh lebih tulus dan setia daripada saya. Tak terasa mata saya mulai berkaca-kaca.\nSaat malam itu saya berada di sini, memperhatikannya belajar. Selesai belajar, dia menyuruh saya pulang karena hendak pergi mencari jangkrik. Saya langsung menyatakan ingin ikut, tapi dia keberatan. Ayah dan ibunya pun melarang. Saya sering mendengar cerita mengasyikan anak-anak beramai-ramai berangkat ke sawah selepas isya untuk mencari jangkrik. Sayang, Ayah tidak pernah membolehkan saya. Tapi malam itu saya nekat dan sahabat saya itu akhirnya tidak kuasa menolak. ”Tidak ganti baju?” tanya saya heran begitu dia langsung memimpin untuk berangkat. Itu hari Jumat. Seragam coklat Pramuka yang dikenakannya sejak pagi masih akan terpakai untuk bersekolah sehari lagi. Dia memang tidak memiliki banyak pakaian hingga seragam sekolah biasa dipakai kapan saja. Tapi memakainya untuk pergi ke sawah mencari jangkrik, rasanya sangat tidak elok.\nSaya mengambil alih obor dari tangannya. Rasanya belum terlalu lama kami berada di sana dan bumbung baru terisi beberapa ekor jangkrik ketika tiba-tiba angin berubah perangai. Kaget, pantat obor itu justru saya angkat tinggi-tinggi sehingga minyak mendorong sumbunya terlepas. Api dengan cepat berpindah membakar punggung saya! Terdengar teriakannya sembari melepaskan seragam coklatnya untuk dipakai menyabet punggung saya. Baju yang saya kenakan habis sepertiganya. Sahabat saya itu tanggap melingkupi tubuh saya                 contextTitle: "Pantai Bersih Tanpa Sampah",
                contextText: `Di sebuah daerah wisata yang terkenal dengan pantainya yang indah, pemerintah setempat gencar mengampanyekan "Pantai Bersih Tanpa Sampah." Spanduk dan papan peringatan terpampang di berbagai sudut. Namun, kenyataannya seringkali berbeda.\nSuatu sore, Pak Wayan, seorang nelayan tua yang sudah puluhan tahun melaut, sedang membersihkan jaringnya di tepi pantai. Di sampingnya, sekelompok turis muda asyik berpose untuk berfoto. Mereka mengenakan topi pantai yang modis, kacamata hitam, dan membawa botol minum berwarna-warni.\n"Wah, pantainya bersih banget ya, guys!" seru salah satu turis sambil memegang ponselnya. "Pas banget buat konten liburan ramah lingkungan!"\nTemannya menimpali, "Iya! Nanti caption-nya 'Menikmati keindahan alam tanpa jejak, menjaga bumi kita tercinta!"\nSetelah puas berfoto dari berbagai sudut dengan beragam filter, mereka beranjak pergi. Namun mereka meninggalkan botol minum plastik kosong, bungkus keripik, dan beberapa puntung rokok yang disembunyikan di balik semak-semak. Mereka bahkan tidak berusaha mencari tempat sampah yang hanya berjarak beberapa meter.\nPak Wayan hanya bisa menggelengkan kepala. Ia berjalan mendekat dan memungut sampah-sampah itu satu per satu. Ia sudah terbiasa dengan pemandangan ini. Para turis datang untuk menikmati keindahan, berfoto, membuat konten, lalu pergi meninggalkan "kenangan" dalam bentuk sampah.\nTak lama kemudian, seorang petugas kebersihan berseragam oranye datang dengan sapu dan karung. "Pak Wayan, sudah banyak lagi ya sampahnya?" tanyanya sambil menghela napas.\n"Sudah biasa, Nak," jawab Pak Wayan. "Ini namanya 'sampah estetik'. Cuma bagus di foto, tapi busuk di mata dan bau di hidung."\nPetugas itu tersenyum masam. "Iya, Pak. Kata mereka peduli lingkungan, tapi pedulinya cuma di caption media sosial."\nMalam harinya, di akun media sosial Pak Wayan - yang diajari cucunya ia melihat foto-foto pantai yang diunggah para turis tadi. Pantai tampak bersih sempurna, dihiasi filter matahari terbenam yang memukau. Ia membaca caption-nya: "Surgaku, jangan kau kotori!"\nPak Wayan hanya bisa tersenyum getir. Sepertinya, slogan "Pantai Bersih Tanpa Sampah" itu hanya berlaku untuk kamera dan media sosial. Sementara di balik layar, jejak yang ditinggalkan justru lebih nyata dan memprihatinkan daripada gambar yang dipamerkan.`,

                contextText: `Berdasarkan hasil riset LIPI (Lembaga Ilmu Pengetahuan Indonesia) terjadi peningkatan sampah plastik selama pandemik. Hal ini disebabkan oleh penggunaan layanan <i>delivery</i> makanan lewat jasa transportasi <i>online</i>, 96% paket dibungkus dengan plastik yang tebal dan ditambah dengan <i>bubble wrap</i>. Selain itu selotip, bungkus plastik, dan <i>bubble wrap</i> merupakan pembungkus berbahan plastik yang paling sering ditemukan. Sampah medis juga melonjak. Kementerian Lingkungan Hidup dan Kehutanan (KLHK) menyatakan bahwa selama pandemi, terjadi peningkatan timbunan sampah medis sebesar 30% hingga 50%. Dari data tersebut, Indonesia merupakan negara ke-2 penyumbang polusi sampah di lautan (3,22 metrik ton per tahun).\nSalah satu faktor penyebab dari permasalahan tersebut adalah dengan pertambahan jumlah penduduk akan terjadi peningkatan aktivitas manusia dan daya konsumsi yang melonjak. Hal itu menyebabkan meningkatnya jumlah dan jenis limbah sehingga menyebabkan lingkungan menjadi tercemar. Selain sampah, penebangan pohon secara liar sampai pada kebakaran hutan menjadi penyumbang terbesar dalam kerusakan ekosistem. Banyak aktivitas manusia yang mengancam pelestarian lingkungan sehingga menyebabkan ketidakseimbangan ekosistem. Manusia punya peran besar dalam menjaga keseimbangan ekosistem, bukan cuma untuk sekarang, tapi juga untuk generasi mendatang. Tanggung jawab dalam menjaga lingkungan, tentunya bukan hanya dibebankan oleh pemerintah saja, tetapi seluruh elemen masyarakat harus bahu-membahu dalam menjaga dan melestarikan lingkungan.\nBertepatan dengan peringatan Hari Lingkungan Hidup Sedunia, yang tidak hanya sebagai seremonial belaka, tentunya menjadi sebuah harapan dalam meningkatkan kesadaran menjaga dan melestarikan lingkungan. Selain itu, memberikan semangat baru bagi kita semua untuk komitmen menjaga lingkungan. Dengan memulai dari diri sendiri dan hal paling kecil, yaitu tidak membuang sampah sembarangan, terutama sampah plastik karena merusak ekosistem laut, tidak menebang pohon dengan liar hingga membuat gundul hutan. Mari bersama merobohkan jurang ekologi, memulihkan ekosistem bumi dengan pendekatan pengelolaan sumber daya alam yang adil dan berkelanjutan.\n(Sumber: UIAD 2021, dengan pengubahan)`,

                bentukSoal: "Pilihan Ganda (PG)",
                contextTitle: "Roh Meratus",
                contextText: `Kami kembali berjalan pulang. Kondisiku sudah sepenuhnya normal. Tetua melangkah di depanku. Tak kusangka, dalam keadaan kritis ternyata kami telah sangat jauh memasuki belantara. Aku memperhatikan pohon-pohon besar yang kami lewati. Sinar matahari bahkan hampir tak bisa menembus ke bawah.\nAku merasa asing di tempat ini. Pohon-pohon yang berlumut itu, sulur-sulur yang bergantungan, semak-semak yang rimbun itu. Oh... ternyata belantara ini adalah tempat menakjubkan. Bayangkan, di lumut batang pohon itu udang-udang kecil berloncatan lincah. Belum pernah aku melihat udang hidup di batang pohon!\n"Kau tahu anak muda, tempat ini merasa terancam dengan keberadaan..." tetua menghentikan langkahnya dan mengambil sesuatu dalam butah. "Roh Meratus meniupkan wisa ke tubuh kalian, sayang kawan-kawanmu yang lain terlambat," sambungnya kemudian melemparkan gulungan kertas yang diambil dari butah. Sigap kutangkap gulungan itu.\n"Itu peta yang kuambil dari ranselmu. Ternyata kalian memasang patok-patok dan memberi tanda pohon-pohon besar untuk ditebang. Dan perlu kau ketahui anak muda, tempat ini juga termasuk wilayah yang akan kalian pasangi patok-patok itu," katanya dingin.\nPerlahan kubuka gulungan peta di tanganku. Dari peta terlihat jelas, pekerjaan kami tinggal sedikit lagi. Jika saja semuanya lancar, maka kami akan sampai di tempat ini dan selesailah kontrak kerja kami. Dalam waktu singkat, mungkin alat-alat berat akan didatangkan! Pohon-pohon ini, sulur-sulur ini, lumut-lumut ini, udang-udang ini... akan bagaimana?\n"Tetua, izinkan aku tinggal di sini dan bersama kaummu menjaga tempat ini..." Akhirnya setelah lama hanya diam, aku menatap mata tetua mantap.\n(Cerpen karya Zaidinoor)\n\nGlosarium:\n• <i>Butah</i>: wadah atau tempat yang digunakan untuk membawa sesuatu dari anyaman rotan/bambu.\n• <i>Wisa</i>: bisa atau racun.`,

                                                            <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                                                                {currentQ.statements.map((st) => {
                                                                    const userChoice = (typeof userAnswers[currentQ.id] === 'object' && !Array.isArray(userAnswers[currentQ.id]))
                                                                        ? userAnswers[currentQ.id][st.id]
                                                                        : undefined;

                                                                    return (
                                                                        <tr key={st.id} className="hover:bg-slate-50 dark:hover:bg-slate-900/40">
                                                                            <td className="p-3 text-center font-bold">{st.id}.</td>
                                                                            <td className="p-3 leading-relaxed" dangerouslySetInnerHTML={{ __html: st.text }}></td>
                                                                            {currentQ.categories.map((cat, cIdx) => {
                                                                                const isChecked = userChoice === cat;
                                                                                return (
                                                                                    <td key={cIdx} className="p-3 text-center">
                                                                                        <button
                                                                                            onClick={() => handleSelectCategory(st.id, cat)}
                                                                                            className={`w-7 h-7 sm:w-8 sm:h-8 rounded-full border inline-flex items-center justify-center font-bold text-xs transition-all ${
                                                                                                isChecked 
                                                                                                    ? 'bg-brand-600 border-brand-600 text-white shadow ring-2 ring-brand-500/20' 
                                                                                                    : 'border-slate-300 dark:border-slate-600 text-transparent'
                                                                                            }`}
                                                                                        >
                                                                                            ✓
                                                                                        </button>
                                                                                    </td>
                                                                                );
                                                                            })}
                                                                        </tr>
                                                                    );
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                )}

                                            </div>

                                            {/* NAVIGATION & QUESTION MAP */}
                                            <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 shadow-sm flex flex-col space-y-4">
                                                <div>
                                                    <div className="text-xs font-semibold text-slate-500 mb-2 flex justify-between items-center">
                                                        <span>Peta Navigasi Soal ({activeExamQuestions.length} Soal)</span>
                                                        <span className="text-[10px] text-slate-400">Hijau: Terjawab | Kuning: Ragu</span>
                                                    </div>
                                                    <div className="grid grid-cols-7 sm:grid-cols-10 gap-2">
                                                        {activeExamQuestions.map((q, idx) => {
                                                            const isAns = isQuestionAnswered(q);
                                                            const isDoubt = doubtStatus[q.id];
                                                            const isCurr = currentIndex === idx;

                                                            let badgeStyle = "bg-slate-100 text-slate-600 border-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:border-slate-600";
                                                            if (isDoubt) {
                                                                badgeStyle = "bg-amber-500 text-white border-amber-600";
                                                            } else if (isAns) {
                                                                badgeStyle = "bg-emerald-600 text-white border-emerald-700";
                                                            }

                                                            return (
                                                                <button
                                                                    key={q.id}
                                                                    onClick={() => setCurrentIndex(idx)}
                                                                    className={`h-9 rounded-lg font-bold text-xs border transition-all flex items-center justify-center ${badgeStyle} ${
                                                                        isCurr ? 'ring-2 ring-brand-500 scale-105' : ''
                                                                    }`}
                                                                >
                                                                    {idx + 1}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>

                                                <div className="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700">
                                                    <button
                                                        disabled={currentIndex === 0}
                                                        onClick={() => setCurrentIndex(currentIndex - 1)}
                                                        className="px-4 py-2 rounded-xl text-xs font-semibold border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 text-slate-700 dark:text-slate-200 disabled:opacity-40"
                                                    >
                                                        &larr; Sebelumnya
                                                    </button>

                                                    {currentIndex === activeExamQuestions.length - 1 ? (
                                                        <button
                                                            onClick={() => setShowConfirmModal(true)}
                                                            className="px-5 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-md transition"
                                                        >
                                                            Selesai Ujian
                                                        </button>
                                                    ) : (
                                                        <button
                                                            onClick={() => setCurrentIndex(currentIndex + 1)}
                                                            className="px-5 py-2 rounded-xl text-xs font-bold bg-brand-600 hover:bg-brand-700 text-white shadow-md transition"
                                                        >
                                                            Selanjutnya &rarr;
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </main>
                                )}
                            </>
                        )}

                        {/* IMAGE ZOOM MODAL */}
                        {showImageModal && (
                            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" onClick={() => setShowImageModal(null)}>
                                <div className="relative max-w-4xl w-full bg-white dark:bg-slate-800 rounded-2xl overflow-hidden p-2" onClick={(e) => e.stopPropagation()}>
                                    <button 
                                        onClick={() => setShowImageModal(null)} 
                                        className="absolute top-4 right-4 bg-slate-900/60 text-white p-2 rounded-full hover:bg-slate-900"
                                    >
                                        ✕
                                    </button>
                                    <img src={showImageModal} alt="Perbesar Gambar" className="w-full h-auto max-h-[85vh] object-contain rounded-xl" />
                                </div>
                            </div>
                        )}

                        {/* CONFIRM SUBMIT MODAL */}
                        {showConfirmModal && (
                            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 text-center">
                                    <div className="w-12 h-12 bg-amber-100 text-amber-600 dark:bg-amber-950 dark:text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4 text-xl">
                                        ⚠️
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-2">Konfirmasi Selesai Ujian</h3>
                                    <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">
                                        Apakah Anda yakin ingin menyelesaikan {activeMode === 'evaluation' ? 'Ujian Penilaian Resmi (28 Soal)' : 'Latihan Soal'} ini?
                                    </p>
                                    <div className="flex space-x-3">
                                        <button 
                                            onClick={() => setShowConfirmModal(false)}
                                            className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            onClick={handleSubmit}
                                            className="flex-1 py-2.5 rounded-xl text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-md"
                                        >
                                            Ya, Selesai
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* FOOTER */}
                        <footer className="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-3 text-center text-xs text-slate-500 dark:text-slate-400">
                            Portal Materi, Soal & Penilaian TKA Bahasa Indonesia • Standar Pusmendik & KBBI • Hak Cipta &copy; {new Date().getFullYear()}
                        </footer>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
