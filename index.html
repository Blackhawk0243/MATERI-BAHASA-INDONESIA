    const TEKS_RHODAMIN = `Teks 1\nRhodamin B adalah zat pewarna yang tersedia di pasar untuk industri tekstil. Zat ini sering disalahgunakan sebagai zat pewarna makanan dan kosmetik di berbagai negara. Jenis makanan yang mengandung Rhodamin B di antaranya kerupuk, terasi, dan makanan ringan. Zat ini juga banyak ditemukan pada kembang gula, sirup, manisan, dawet, bubur, ikan asap, dan cendol. Tampilan makanan yang menggunakan zat ini cenderung menarik dan terkesan menawarkan cita rasa tinggi sehingga ketika harga jualnya tidak semahal tampilannya, banyak yang tertarik untuk membeli dan mengonsumsinya. Zat ini paling berbahaya bila dikonsumsi karena menyebabkan gangguan pada fungsi hati, bahkan kanker hati. Apabila mengonsumsi makanan yang mengandung Rhodamin B, dalam tubuh akan terjadi penumpukan lemak sehingga lama-kelamaan jumlahnya akan terus bertambah. Dampaknya baru akan kelihatan setelah puluhan tahun kemudian. Jika sudah masuk dalam tubuh, akan mengendap pada jaringan hati dan lemak, tidak dapat dikeluarkan, dan dalam jangka waktu lama bisa bersifat karsinogenik.\n\nTeks 2\nRhodamin B berbentuk serbuk kristal, berwarna hijau atau ungu kemerahan, tidak berbau, dan dalam larutan akan berwarna merah terang berpendar atau berfluoresensi. Rhodamin B merupakan zat warna golongan xanthenes dyes, dan digunakan pada industri tekstil dan kertas, sebagai pewarna kain, kosmetika, produk pembersih mulut, dan sabun. Rhodamin B memiliki berbagai nama lain, antara lain: Tetra ethyl rhodamin; Rheoninine B, D, & C; Red No. 19; Food Red 15; ADC Rhodamine B; Aizen Rhodamine; dan Brilliant Pink B. Rhodamin B mengandung senyawa klorin (Cl) yang merupakan senyawa halogen yang berbahaya dan reaktif. Jika tertelan, senyawa ini akan berusaha mencapai kestabilan dalam tubuh dengan cara mengikat senyawa lain dalam tubuh. Mengonsumsi bahan pangan yang mengandung Rhodamin B dalam jangka panjang dapat terakumulasi di dalam tubuh dan dapat menyebabkan gejala pembesaran hati dan ginjal, gangguan fungsi hati, kerusakan hati, gangguan fisiologis tubuh, bahkan dapat menyebabkan timbulnya kanker hati.`;

    const TEKS_UKM = `Dampak Ekonomi Digital terhadap Pertumbuhan Usaha Kecil dan Menengah (UKM)\n\nEkonomi digital telah membawa perubahan besar dalam berbagai aspek bisnis, terutama bagi Usaha Kecil dan Menengah (UKM). Dengan adanya teknologi digital, UKM kini memiliki peluang lebih besar untuk berkembang dan bersaing di pasar yang lebih luas. Transformasi ini didorong oleh beberapa faktor utama, seperti perkembangan e-commerce, sistem pembayaran digital, pemasaran berbasis data, serta pemanfaatan teknologi berbasis kecerdasan buatan (artificial intelligence).\n\nSalah satu perubahan signifikan dalam ekonomi digital adalah kemudahan akses ke platform e-commerce. UKM yang sebelumnya hanya mengandalkan toko fisik kini dapat menjual produknya melalui berbagai marketplace daring. Hal ini memungkinkan mereka menjangkau konsumen di luar wilayah lokal, bahkan hingga ke pasar internasional. Dengan biaya operasional yang lebih rendah dibandingkan toko fisik, UKM dapat mengalokasikan dana untuk inovasi dan peningkatan kualitas produk. Selain itu, sistem pengiriman yang semakin efisien memungkinkan UKM memenuhi pesanan dengan lebih cepat dan tepat waktu.\n\nSelain akses pasar yang lebih luas, sistem pembayaran digital juga telah meningkatkan efisiensi transaksi keuangan. Penggunaan dompet digital dan pembayaran nontunai tidak hanya mempermudah konsumen dalam berbelanja, tetapi juga membantu UKM dalam mencatat keuangan secara lebih akurat. Keuntungan lain dari ekonomi digital adalah strategi pemasaran berbasis data. Melalui analisis data pelanggan, UKM dapat memahami tren pasar dan perilaku konsumen dengan lebih baik. Misalnya, penggunaan iklan digital yang ditargetkan memungkinkan UKM menjangkau segmen pasar yang lebih spesifik sehingga efektivitas promosi meningkat.\n\nMeskipun menawarkan banyak manfaat, transformasi digital juga menghadirkan tantangan. UKM harus mampu beradaptasi dengan perkembangan teknologi dan meningkatkan literasi digital agar tetap kompetitif. Selain     const TEKS_SERAGAM = `Hampir 25 tahun lalu kami berpisah karena keluarga saya harus boyongan ke kota tempat kerja Ayah yang baru di luar pulau. Tak satupun barang tertinggal di rumah lama. Begitu juga dengan sahabatku, kami harus berpisah.\nBertemu dengannya setelah sekian lama, mengingatkan kembali pada pengalaman kami dahulu. Pengalaman yang menjadikan dia, walau tidak setiap waktu, selalu lekat di ingatan saya. Tentu dia mengingatnya pula, bahkan saya yakin rasa yang diidapnya lebih besar efeknya. Karena sebagai seorang sahabat, dia jelas jauh lebih tulus dan setia daripada saya. Tak terasa mata saya mulai berkaca-kaca.\nSaat malam itu saya berada di sini, memperhatikannya belajar. Selesai belajar, dia menyuruh saya pulang karena hendak pergi mencari jangkrik. Saya langsung menyatakan ingin ikut, tapi dia keberatan. Ayah dan ibunya pun melarang. Saya sering mendengar cerita mengasyikan anak-anak beramai-ramai berangkat ke sawah selepas isya untuk mencari jangkrik. Sayang, Ayah tidak pernah membolehkan saya. Tapi malam itu saya nekat dan sahabat saya itu akhirnya tidak kuasa menolak. ”Tidak ganti baju?” tanya saya heran begitu dia langsung memimpin untuk berangkat. Itu hari Jumat. Seragam coklat Pramuka yang dikenakannya sejak pagi masih akan terpakai untuk bersekolah sehari lagi. Dia memang tidak memiliki banyak pakaian hingga seragam sekolah biasa dipakai kapan saja. Tapi memakainya untuk pergi ke sawah mencari jangkrik, rasanya sangat tidak elok.\nSaya mengambil alih obor dari tangannya. Rasanya belum terlalu lama kami berada di sana dan bumbung baru terisi beberapa ekor jangkrik ketika tiba-tiba angin berubah perangai. Kaget, pantat obor itu justru saya angkat tinggi-tinggi sehingga minyak mendorong sumbunya terlepas. Api dengan cepat berpindah membakar punggung saya! Terdengar teriakannya sembari melepaskan seragam coklatnya untuk dipakai menyabet punggung saya. Baju yang saya kenakan habis sepertiganya. Sahabat saya itu tanggap melingkupi tubuh saya deng     const TEKS_BUWUHAN = `Tradisi Buwuhan: Antara Gotong Royong dan Utang Piutang\n\nTradisi buwuhan merupakan bagian dari budaya masyarakat Jawa, khususnya di kota-kota besar seperti Surabaya. Tradisi ini dilakukan ketika ada acara penting seperti pernikahan atau khitanan yang diadakan di daerah tersebut. Buwuhan merujuk pada kegiatan memberi bantuan, baik berupa barang, uang, maupun tenaga kepada seseorang yang sedang mengadakan hajatan, atau bisa juga disebut sebagai kegiatan menyumbang. Tradisi ini mencerminkan nilai gotong royong dan solidaritas sosial karena keluarga dan tetangga saling bahu-membahu dalam membantu sesama.\n\nNamun, praktik buwuhan tidak lepas dari unsur pertukaran atau dipandang sebagai utang. Masyarakat meyakini bahwa segala bentuk bantuan yang diberikan akan kembali dalam bentuk yang setara ketika si pemberi mengadakan hajatan serupa. Hal ini menyebabkan buwuhan tidak lagi dipandang murni sebagai hibah atau sedekah, tetapi sebagai bentuk "utang tidak tertulis" yang menimbulkan kewajiban moral untuk membalas.\n\nDalam praktiknya, buwuhan memang meringankan beban tuan rumah, tetapi dapat menimbulkan tekanan psikologis bagi penerima bantuan. Rasa malu dan kekhawatiran kehilangan harga diri mendorong sebagian orang untuk berutang demi mengembalikan buwuhan. Hal ini menyebabkan terbaginya cara pandang terhadap buwuhan. Ada yang melihatnya sebagai bentuk tolong-menolong, tetapi ada juga yang justru menganggapnya menjadi sistem utang piutang berbasis sosial. Sebagian pihak berpendapat bahwa buwuhan adalah hibah karena tujuannya adalah untuk membantu. Namun, apabila ada keharusan pengembalian, maka secara hukum dan etika, buwuhan telah bergeser dari semangat gotong royong menjadi sebuah kewajiban ekonomi yang membebani. Oleh karena itu, pemahaman masyarakat terhadap tradisi buwuhan perlu diluruskan agar nilai luhur tolong-menolong tetap terjaga tanpa menimbulkan beban yang tidak perlu.\n\nSumber: Rachmawati, S. A., & Anwar, M. K. (2021). Budaya dan     const TEKS_LAYUR = `Layur, Teruslah Berlayar\n\n"Bapak, pulanglah," lirih Layur berharap. Ini hari keenam. Tiga hari adalah waktu terlama nelayan berada di laut. Dengan susah payah, Layur berpindah duduk ke dalam sebuah perahu tua. Penyangga kedua kaki Layur yang tak utuh ia letakkan di sampingnya.\n"Jangan-jangan..."\n"Tidak ... Aku tidak boleh berpikiran buruk. Bapak pasti pulang dengan selamat. Aku akan tetap menunggunya di sini sambil berdoa."\nLayur masih ingat masa-masa dulu, ketika Bapak berlayar pada malam hari dan keesokan harinya sudah merapat kembali di pantai dengan membawa ikan berlimpah.\n"Ayo! Siapa mau udang?" panggil Bapak. Layur berlari kencang bersama teman-temannya. Namun, itu adalah kenangan sepuluh tahun silam. Kini, udang dan ikan kecil adalah anugerah besar. Itu pun harus dijaring di tengah laut.\nLayur ingat betul, Bapak adalah pembuat bondet paling disegani, juga berpengaruh di dusun. Setiap hari, nelayan silih berganti datang ke rumah memesan bondet. Hasil panen ikan berlimpah. Tinggal melemparkan bondet ke dalam laut dan bum! Berkuintal-kuintal ikan terapung tinggal diserok menggunakan jaring.\nSampai suatu ketika\nDUAAAR!\nSeparuh rumah Layur luluh lantak karena simpanan bondet di gudang meledak. Ledakan bondet di gudang tak hanya merusak rumah tetapi juga mencelakai anak semata wayang. Ia berteriak minta tolong, menepuk-nepuk dadanya, dan menangis. Itulah titik balik yang amat disesali Bapak. Sejak itu, Bapak meninggalkan usaha pembuatan bondet. Demikian pula dengan warga Dusun Prau tempat mereka berdiam berangsur-angsur meninggalkan cara menangkap ikan dengan bondet.\nLamat-lamat terlihat kibaran layar bercorak biru. Layur beringsut menuruni perahu tempatnya duduk. Lambaian tangan bapaknya semakin jelas dan semakin dekat.\n"Bapak dari mana? Bapak sudah tiga hari telat pulang!" Seru Layur kesal. Matanya berkaca-kaca, menahan rindu, dan cemas.\n\nKarya Anang YB\nDaftar Istilah: Bondet: istilah lokal yang merujuk pada bahan peledak rakitan, sering disebut juga bom ikan.\nSumber: https://buku.kemdikbud.go.id/katalog/layur-tetaplah-berlayar (dengan pengubahan)`;

    const TEKS_PANTAI = `Pantai Bersih Tanpa Sampah\n\nDi sebuah daerah wisata yang terkenal dengan pantainya yang indah, pemerintah setempat gencar mengampanyekan "Pantai Bersih Tanpa Sampah." Spanduk dan papan peringatan terpampang di berbagai sudut. Namun, kenyataannya seringkali berbeda.\nSuatu sore, Pak Wayan, seorang nelayan tua yang sudah puluhan tahun melaut, sedang membersihkan jaringnya di tepi pantai. Di sampingnya, sekelompok turis muda asyik berpose untuk berfoto. Mereka mengenakan topi pantai yang modis, kacamata hitam, dan membawa botol minum berwarna-warni.\n"Wah, pantainya bersih banget ya, guys!" seru salah satu turis sambil memegang ponselnya. "Pas banget buat konten liburan ramah lingkungan!"\nTemannya menimpali, "Iya! Nanti caption-nya 'Menikmati keindahan alam tanpa jejak, menjaga bumi kita tercinta!"\nSetelah puas berfoto dari berbagai sudut dengan beragam filter, mereka beranjak pergi. Namun mereka meninggalkan botol minum plastik kosong, bungkus keripik, dan beberapa puntung rokok yang disembunyikan di balik semak-semak. Mereka bahkan tidak berusaha mencari tempat sampah yang hanya berjarak beberapa meter.\nPak Wayan hanya bisa menggelengkan kepala. Ia berjalan mendekat dan memungut sampah-sampah itu satu per satu. Ia sudah terbiasa dengan pemandangan ini. Para turis datang untuk menikmati keindahan, berfoto, membuat konten, lalu pergi meninggalkan "kenangan" dalam bentuk sampah.\nTak lama kemudian, seorang petugas kebersihan berseragam oranye datang dengan sapu dan karung. "Pak Wayan, sudah banyak lagi ya sampahnya?" tanyanya sambil menghela napas.\n"Sudah biasa, Nak," jawab Pak Wayan. "Ini namanya 'sampah estetik'. Cuma bagus di foto, tapi busuk di mata dan bau di hidung."\nPetugas itu tersenyum masam. "Iya, Pak. Kata mereka peduli lingkungan, tapi pedulinya cuma di caption media sosial."\nMalam harinya, di akun media sosial Pak Wayan - yang diajari cucunya - ia melihat foto-foto pantai yang diunggah para turis tadi. Pantai tampak bersih sempurna, dihiasi filter matahari terbenam yang memukau. Ia membaca caption-nya: "Surgaku, jangan kau kotori!"\nPak Wayan hanya bisa tersenyum getir. Sepertinya, slogan "Pantai Bersih Tanpa Sampah" itu hanya berlaku untuk kamera dan media sosial. Sementara di balik layar, jejak yang ditinggalkan justru lebih nyata dan memprihatinkan daripada gambar yang dipamerkan.`;

    const TEKS_PULIHKAN = `Pulihkan Ekosistem, Menjaga Planet Kita dari Generasi ke Generasi\n\nBerdasarkan hasil riset LIPI (Lembaga Ilmu Pengetahuan Indonesia) terjadi peningkatan sampah plastik selama pandemik. Hal ini disebabkan oleh penggunaan layanan delivery makanan lewat jasa transportasi online, 96% paket dibungkus dengan plastik yang tebal dan ditambah dengan bubble wrap. Selain itu selotip, bungkus plastik, dan bubble wrap merupakan pembungkus berbahan plastik yang paling sering ditemukan. Sampah medis juga melonjak. Kementerian Lingkungan Hidup dan Kehutanan (KLHK) menyatakan bahwa selama pandemi, terjadi peningkatan timbunan sampah medis sebesar 30% hingga 50%. Dari data tersebut, Indonesia merupakan negara ke-2 penyumbang polusi sampah di lautan (3,22 metrik ton per tahun).\n\nSalah satu faktor penyebab dari permasalahan tersebut adalah dengan pertambahan jumlah penduduk akan terjadi peningkatan aktivitas manusia dan daya konsumsi yang melonjak. Hal itu menyebabkan meningkatnya jumlah dan jenis limbah sehingga menyebabkan lingkungan menjadi tercemar. Selain sampah, penebangan pohon secara liar sampai pada kebakaran hutan menjadi penyumbang terbesar dalam kerusakan ekosistem. Banyak aktivitas manusia yang mengancam pelestarian lingkungan sehingga menyebabkan ketidakseimbangan ekosistem. Manusia punya peran besar dalam menjaga keseimbangan ekosistem, bukan cuma untuk sekarang, tapi juga untuk generasi mendatang. Tanggung jawab dalam menjaga lingkungan, tentunya bukan hanya dibebankan oleh pemerintah saja, tetapi seluruh elemen masyarakat harus bahu-membahu dalam menjaga dan melestarikan lingkungan.\n\nBertepatan dengan peringatan Hari Lingkungan Hidup Sedunia, yang tidak hanya sebagai seremonial belaka, tentunya menjadi sebuah harapan dalam meningkatkan kesadaran menjaga dan melestarikan lingkungan. Selain itu, memberikan semangat baru bagi kita semua untuk komitmen menjaga lingkungan. Dengan memulai dari diri sendiri dan hal paling kecil, yaitu tidak membuang sampah sembarangan, terutama sampah plastik karena merusak ekosistem laut, tidak menebang pohon dengan liar hingga membuat gundul hutan. Mari bersama merobohkan jurang ekologi, memulihkan ekosistem bumi dengan pendekatan pengelolaan sumber daya alam yang adil dan berkelanjutan.\n\nSumber: https://uiad.ac.id/2021/06/06/opini-pulihkan-ekosistem-menjaga-planet-kita-dari-generasi-ke-generasi/ (dengan pengubahan)`;

    const TEKS_EKONOMI_GLOBAL = `Prospek Ekonomi Global di Tengah Ketidakpastian\nJakarta, Senin, 16 Juni 2025\n\nPerekonomian global terus menghadapi tantangan signifikan di tengah ketidakpastian geopolitik dan tekanan inflasi yang persisten. Analisis terbaru yang dirilis pada (Senin, 2/6/2025), oleh Dana Moneter Internasional (IMF) menunjukkan adanya divergensi dalam laju pemulihan ekonomi antarwilayah, di mana beberapa negara seperti Amerika Serikat dan India menunjukkan ketahanan yang lebih baik, sementara negara-negara di Eropa dan Tiongkok masih berjuang mengatasi dampak guncangan eksternal.\n\nKenaikan harga energi dan pangan tetap menjadi pendorong utama inflasi di banyak negara, dipicu oleh gangguan rantai pasok global dan konflik di Ukraina, memaksa bank sentral untuk mempertahankan kebijakan moneter yang ketat. Upaya ini, meskipun esensial untuk mengendalikan kenaikan harga, berpotensi mengerem pertumbuhan ekonomi. Para pengambil kebijakan dihadapkan pada dilema sulit: menyeimbangkan kebutuhan untuk meredam inflasi tanpa memicu resesi yang dalam.\n\n"Kami melihat adanya perlambatan pertumbuhan global yang signifikan di tahun ini, dan risiko resesi menjadi lebih nyata jika bank sentral terlalu agresif dalam menaikkan suku bunga," ujar seorang ekonom senior dari Bank Dunia, dalam sebuah webinar yang diadakan, (Rabu, 11/6).\n\nDi sisi lain, sektor manufaktur global menunjukkan tanda-tanda perlambatan, tercermin dari menurunnya indeks manajer pembelian (PMI) di beberapa ekonomi besar seperti Jerman dan Jepang. Penurunan permintaan ekspor dan gangguan rantai pasok masih menjadi perhatian utama bagi produsen. Namun, sektor jasa justru menunjukkan resiliensi yang lebih kuat, didukung oleh kembali normalnya aktivitas setelah pandemi, sebuah tren yang mulai terlihat sejak awal Desember 2024.\n\nPasar tenaga kerja di beberapa negara maju masih relatif ketat, dengan tingkat pengangguran yang rendah. Kondisi ini memberikan dukungan terhadap daya beli konsumen, meskipun tekanan biaya hidup yang tinggi dapat mengikis dampaknya. Sementara itu, investasi langsung asing (FDI) cenderung melambat, mencerminkan kehati-hatian investor di tengah prospek ekonomi yang tidak menentu.\n\nKe depan, koordinasi kebijakan ekonomi antarnegara akan menjadi kunci untuk menstabilkan kondisi global. Reformasi struktural yang bertujuan meningkatkan produktivitas dan daya saing juga dianggap krusial untuk memastikan pertumbuhan yang berkelanjutan dalam jangka panjang. Para ekonom memprediksi bahwa prospek ekonomi akan sangat bergantung pada evolusi inflasi, respons kebijakan moneter, dan perkembangan situasi geopolitik di seluruh dunia. Bagi Indonesia, kondisi ini menuntut kewaspadaan dan diversifikasi ekonomi agar tidak terlalu rentan terhadap gejolak global dalam kurun waktu tiga hingga enam bulan ke depan, terhitung sejak (16/6/2025).\n\nSumber: Disadur dan diadaptasi dari rilis pers dan laporan Global Economic Prospects, Juni 2025 oleh World Bank (Bank Dunia).`;

    const TEKS_HUDOQ = `Tari Hudoq: Warisan Budaya yang Harus Dilestarikan\n\nTari Hudoq dari suku Dayak Modang di Kalimantan Timur bukan sekadar tontonan seni biasa. Lebih dari itu, tarian ini adalah warisan budaya yang sarat akan makna spiritual dan simbolis. Oleh karena itu, melestarikan Tari Hudoq menjadi sebuah keharusan, tidak hanya untuk menjaga keragaman budaya Indonesia, tetapi juga untuk mengingatkan kita akan pentingnya hubungan harmonis antara manusia dan alam.\n\nPertama, Tari Hudoq adalah cerminan dari kearifan lokal yang mengajarkan nilai-nilai fundamental. Tarian ini merupakan bagian integral dari ritual keagamaan untuk menjalin hubungan harmonis dengan roh penjaga pertanian, Halaeng Heboung, dan roh pelindung umat manusia, Selo Sen. Dalam era modern yang sering kali mengabaikan hubungan manusia dengan alam, tarian ini berfungsi sebagai pengingat kuat akan ketergantungan kita pada alam dan pentingnya menghormati kekuatan yang lebih besar dari diri kita.\n\nKedua, setiap elemen dalam Tari Hudoq mengandung simbolisme yang mendalam dan relevan. Penggunaan topeng kayu yang besar dan dedaunan yang menutupi tubuh penari bukan sekadar properti, melainkan representasi kekuatan dan perlindungan dari roh-roh tersebut. Gerakan tari yang menggambarkan keteguhan petani serta nyanyian tradisional yang mengiringinya adalah permohonan tulus kepada alam semesta untuk memberikan keseimbangan dan kesuksesan panen. Menghilangkan tarian ini berarti menghilangkan simbolisme penting yang telah diwariskan turun-temurun, yang merupakan esensi dari budaya Dayak Modang itu sendiri.\n\nKetiga, Tari Hudoq memiliki nilai edukatif yang tinggi bagi masyarakat luas, termasuk wisatawan. Pertunjukan ini tidak hanya memukau secara visual, tetapi juga memberikan pemahaman tentang pentingnya keseimbangan alam dan hubungan spiritual yang mendalam. Dengan melestarikan dan memperkenalkan tarian ini kepada publik yang lebih luas, kita tidak hanya menjaga keberadaan tarian itu sendiri, tetapi juga menyebarkan pesan tentang pentingnya menjaga lingkungan dan menghargai nilai-nilai tradisional.\n\nDengan demikian, jelaslah bahwa Tari Hudoq bukan sekadar pertunjukan, melainkan sebuah jembatan spiritual yang menghubungkan manusia dengan alam dan leluhur. Mengabaikan pelestariannya sama saja dengan mengabaikan kekayaan spiritual dan kearifan lokal yang menjadi fondasi budaya kita. Pelestarian Tari Hudoq adalah investasi untuk masa depan, memastikan bahwa nilai-nilai berharga ini tetap hidup dan relevan bagi generasi mendatang.\n\nSumber: Kebudayaan Kemdikbud, Pustaka Borneo, Times Nusantara (dengan penyesuaian)`;

    const TEKS_MERATUS = `Roh Meratus\n\nKami kembali berjalan pulang. Kondisiku sudah sepenuhnya normal. Tetua melangkah di depanku. Tak kusangka, dalam keadaan kritis ternyata kami telah sangat jauh memasuki belantara. Aku memperhatikan pohon-pohon besar yang kami lewati. Sinar matahari bahkan hampir tak bisa menembus ke bawah.\nAku merasa asing di tempat ini. Pohon-pohon yang berlumut itu, sulur-sulur yang bergantungan, semak-semak yang rimbun itu. Oh... ternyata belantara ini adalah tempat menakjubkan. Bayangkan, di lumut batang pohon itu udang-udang kecil berloncatan lincah. Belum pernah aku melihat udang hidup di batang pohon!\n"Kau tahu anak muda, tempat ini merasa terancam dengan keberadaan..." tetua menghentikan langkahnya dan mengambil sesuatu dalam butah. "Roh Meratus meniupkan wisa ke tubuh kalian, sayang kawan-kawanmu yang lain terlambat," sambungnya kemudian melemparkan gulungan kertas yang diambil dari butah. Sigap kutangkap gulungan itu.\n"Itu peta yang kuambil dari ranselmu. Ternyata kalian memasang patok-patok dan memberi tanda pohon-pohon besar untuk ditebang. Dan perlu kau ketahui anak muda, tempat ini juga termasuk wilayah yang akan kalian pasangi patok-patok itu," katanya dingin.\nPerlahan kubuka gulungan peta di tanganku. Dari peta terlihat jelas, pekerjaan kami tinggal sedikit lagi. Jika saja semuanya lancar, maka kami akan sampai di tempat ini dan selesailah kontrak kerja kami. Dalam waktu singkat, mungkin alat-alat berat akan didatangkan! Pohon-pohon ini, sulur-sulur ini, lumut-lumut ini, udang-udang ini... akan bagaimana?\n"Tetua, izinkan aku tinggal di sini dan bersama kaummu menjaga tempat ini..." Akhirnya setelah lama hanya diam, aku menatap mata tetua mantap.\n\n(Cerpen karya Zaidinoor)\nGlosarium:\nButah: wadah atau tempat yang digunakan untuk membawa sesuatu, biasanya terbuat dari anyaman rotan atau bambu\nWisa: bisa atau racun`;

    const TEKS_BELIS = `Tradisi Belis: Simbol Budaya yang Menyimpan Beban Finansial di Era Modern\n\nBelis adalah tradisi di wilayah Indonesia bagian timur seperti Nusa Tenggara Timur, yang secara umum di Indonesia dikenal dengan mas kawin atau mahar. Tradisi ini melambangkan penghormatan kepada wanita dan penyatuan keluarga. Namun, di balik nilainya, belis sering menjadi beban finansial berat bagi pihak laki-laki, yang kadang memicu tekanan psikologis dan mengganggu hubungan kekeluargaan. Beberapa pihak, terutama para sesepuh desa atau orang-orang tua, kadang terlalu kukuh untuk mempertahankan tradisi dan membuat tekanan dengan nilai yang semakin naik.\n\nBelis memiliki makna yang mendalam dan dianggap sebagai bentuk pengakuan atas peran penting seorang perempuan di dalam keluarga. Belis merupakan representasi keseriusan dan komitmen seorang pria untuk membangun keluarga. Proses penyerahan belis tidak hanya dimaknai sebagai pertukaran materi, tetapi juga sebagai simbol penyatuan dua komunitas besar, yakni keluarga kedua belah pihak. Pada masyarakat Lamaholot misalnya, belis diwujudkan dalam bentuk gading gajah atau bala, yang besarnya disesuaikan dengan status sosial seorang perempuan. Selain itu, disertakan juga pelengkap belis seperti sarung tenun sutra dan ternak. Uniknya, meskipun belis dari pihak laki-laki, pihak keluarga perempuan memberikan balasan simbolis kepada pihak laki-laki dalam bentuk barang berharga lainnya. Tradisi ini mengajarkan keseimbangan dan saling menghargai di antara kedua belah pihak.\n\nMeskipun belis mengandung nilai-nilai yang positif, tantangannya saat ini adalah menjaga agar tradisi tersebut tidak menjadi beban finansial yang berat. Tuntutan belis yang tinggi sering kali menjadi sumber tekanan, terutama bagi keluarga laki-laki. Dalam beberapa kasus, perkara belis dapat berimbas pada kesehatan mental hingga memicu tindakan tragis, seperti yang pernah terjadi di Kupang. Selain menjadi tantangan finansial, besarnya tuntutan materi untuk belis juga sering kali menimbulkan ketegangan dan konflik di antara pasangan dan keluarganya. Ketika keluarga perempuan menetapkan nominal belis yang tinggi, tidak jarang hal ini membangkitkan sentimen negatif dari pihak laki-laki yang merasa tertekan dan kehilangan martabat jika tidak mampu memenuhinya. Alhasil, penundaan pernikahan diambil guna memenuhi permintaan belis. Konflik semacam ini bisa merusak hubungan dua keluarga yang harusnya harmonis.\n\nSumber: Berita Kini, Krajan.id (dengan penyesuaian)`;

          const exists = curr.indexOf(optionIdx);
          if (exists > -1) {
            curr.splice(exists, 1);
          } else {
            curr.push(optionIdx);
            curr.sort((a, b) => a - b);
          }
          return { ...prev, [qId]: curr };
        });
      };

              }
            }

              const isMatch = q.statements.every((_, i) => ans[i] === q.correctAnswer[i]);
              if (isMatch) correctCount++;
            }
          }
        });

                    <div>
                      <span className="px-2.5 py-0.5 bg-slate-100 text-slate-700 text-xs font-bold rounded">Sub Bab 1</span>
                      <h3 className="font-extrabold text-slate-900 text-lg mt-2">Pemahaman Tekstual</h3>
                      <p className="text-xs text-slate-500 mt-1">Kata serapan baku, pemahaman bagan, dan analisis struktur informasi.</p>
                    </div>
                    <button
                      onClick={() => {
                        const filtered = latihanSoalData.filter(q => q.subBab === 1);
                        startExam(filtered, "Latihan Sub Bab 1: Pemahaman Tekstual", "latihan");
                      }}
                      className="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl transition"
                    >
                      Mulai Sub Bab 1 ({latihanSoalData.filter(q => q.subBab === 1).length} Soal)
                    </button>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <span className="px-2.5 py-0.5 bg-slate-100 text-slate-700 text-xs font-bold rounded">Sub Bab 2</span>
                      <h3 className="font-extrabold text-slate-900 text-lg mt-2">Pemahaman Inferensial</h3>
                      <p className="text-xs text-slate-500 mt-1">Ide pokok tersirat, hubungan kausalitas paragraf, dan prediksi cerita.</p>
                    </div>
                    <button
                      onClick={() => {
                        const filtered = latihanSoalData.filter(q => q.subBab === 2);
                        startExam(filtered, "Latihan Sub Bab 2: Pemahaman Inferensial", "latihan");
                      }}
                      className="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl transition"
                    >
                      Mulai Sub Bab 2 ({latihanSoalData.filter(q => q.subBab === 2).length} Soal)
                    </button>
                  </div>

                  <div className="bg-white p-5 rounded-2xl border border-slate-200 shadow-sm flex flex-col justify-between">
                    <div>
                      <span className="px-2.5 py-0.5 bg-slate-100 text-slate-700 text-xs font-bold rounded">Sub Bab 3</span>
                      <h3 className="font-extrabold text-slate-900 text-lg mt-2">Evaluasi & Apresiasi</h3>
                      <p className="text-xs text-slate-500 mt-1">Evaluasi validitas data statistik, gaya bahasa, serta nilai sosial sastra.</p>
                    </div>
                    <button
                      onClick={() => {
                        const filtered = latihanSoalData.filter(q => q.subBab === 3);
                        startExam(filtered, "Latihan Sub Bab 3: Evaluasi & Apresiasi", "latihan");
                      }}
                      className="mt-4 w-full py-2 bg-slate-800 hover:bg-slate-900 text-white font-bold text-xs rounded-xl transition"
                    >
                      Mulai Sub Bab 3 ({latihanSoalData.filter(q => q.subBab === 3).length} Soal)
                    </button>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 4: MENU PENILAIAN */}
            {currentTab === "penilaian" && (
              <div className="space-y-6">
                <div className="bg-gradient-to-br from-amber-500 to-orange-600 p-6 sm:p-8 rounded-3xl text-white shadow-lg">
                  <span className="px-3 py-1 bg-black/20 rounded-full text-xs font-extrabold uppercase tracking-wider">
                    Ujian Penilaian Kemampuan Mandiri
                  </span>
                  <h2 className="text-2xl sm:text-3xl font-black mt-3">Simulasi Asesmen Asli TKA 2025 SMA/SMK</h2>
                  <p className="text-amber-100 text-sm sm:text-base mt-2 max-w-2xl leading-relaxed">
                    Ujian resmi berisi 28 butir soal lengkap yang menguji seluruh spektrum literasi membaca teks sastra dan nonfiksi kontemporer.
                  </p>
                  <div className="mt-5">
                    <button
                      onClick={() => startExam(penilaianSoalData, "Penilaian Resmi TKA 2025 (28 Soal)", "penilaian")}
                      className="px-6 py-3 bg-white text-amber-900 font-extrabold text-sm rounded-xl shadow hover:bg-amber-50 transition"
                    >
                      Mulai Penilaian Sekarang (28 Soal) →
                    </button>
                  </div>
                </div>

                <div className="bg-white p-6 rounded-2xl border border-slate-200 shadow-sm space-y-4">
                  <h3 className="font-bold text-slate-900 text-base">Ketentuan Teknis Pengerjaan:</h3>
                  <ul className="list-disc pl-5 text-sm text-slate-600 space-y-2">
                    <li>Terdiri atas <strong>28 nomor soal</strong> dengan teks wacana mandiri pada setiap butir soal.</li>
                    <li>Mencakup beragam tipe soal asesmen nasional: <em>Pilihan Ganda Tunggal (PG)</em> dan <em>PGK Kategori Matriks (Benar/Salah)</em>.</li>
                    <li>Dilengkapi tabel spesifikasi resmi (*No Soal*, *Kompetensi*, *Sub Kompetensi*, *Bentuk Soal*) pada setiap butir soal.</li>
                    <li>Analisis nilai akhir dan tinjauan kunci jawaban akan ditampilkan secara otomatis setelah Anda mengonfirmasi penyelesaian ujian.</li>
                  </ul>
                </div>
              </div>
            )}

            {/* INTERFACE PENGERJAAN CBT */}
            {currentTab === "exam" && currentQ && (
              <div className="space-y-4">
                {/* Exam Sub-Header */}
                <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex flex-wrap items-center justify-between gap-3">
                  <div>
                    <span className="text-xs font-bold text-blue-600 uppercase tracking-wider">
                      {examMode === "penilaian" ? "🎯 Penilaian Resmi" : "✍️ Sesi Latihan"}
                    </span>
                    <h2 className="font-extrabold text-slate-900 text-base sm:text-lg">{examTitle}</h2>
                  </div>

                  <div className="flex items-center gap-2">
                    <div className="flex items-center bg-slate-100 rounded-lg p-1 text-xs font-bold">
                      <button 
                        onClick={() => setFontSizeClass("text-sm")}
                        className={`px-2 py-1 rounded ${fontSizeClass === "text-sm" ? "bg-white shadow-sm" : "text-slate-600"}`}
                      >
                        A-
                      </button>
                      <button 
                        onClick={() => setFontSizeClass("text-base")}
                        className={`px-2 py-1 rounded ${fontSizeClass === "text-base" ? "bg-white shadow-sm" : "text-slate-600"}`}
                      >
                        A
                      </button>
                      <button 
                        onClick={() => setFontSizeClass("text-lg")}
                        className={`px-2 py-1 rounded ${fontSizeClass === "text-lg" ? "bg-white shadow-sm" : "text-slate-600"}`}
                      >
                        A+
                      </button>
                    </div>

                    <button
                      onClick={() => toggleFlag(currentQ.id)}
                      className={`px-3 py-1.5 rounded-lg text-xs font-bold border transition ${
                        flagged[currentQ.id]
                          ? "bg-amber-400 border-amber-500 text-slate-900 font-black"
                          : "border-slate-300 text-slate-600 hover:bg-slate-50"
                      }`}
                    >
                      {flagged[currentQ.id] ? "★ Ragu-ragu" : "☆ Tandai Ragu"}
                    </button>
                  </div>
                </div>

                {/* Split Screen Container */}
                <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
                  {/* PANEL KIRI: BAHAN BACAAN / STIMULUS */}
                  <div className="lg:col-span-7 bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm flex flex-col max-h-[75vh] overflow-y-auto">
                    <div className="border-b border-slate-100 pb-3 mb-4 flex items-center justify-between">
                      <h3 className="font-bold text-slate-800 text-sm flex items-center gap-2">
                        <span className="w-2 h-2 rounded-full bg-blue-600"></span>
                        Bahan Bacaan & Stimulus Soal
                      </h3>
                      <span className="text-xs text-slate-400">Nomor {currentIndex + 1} dari {activeQuestions.length}</span>
                    </div>

                    {/* Gambar Stimulus (Jika Ada) */}
                    {currentQ.stimulusImage && (
                      <div className="mb-4 rounded-xl overflow-hidden border border-slate-200 bg-slate-50 p-2">
                        <img 
                          src={currentQ.stimulusImage}
                          alt="Stimulus Soal"
                          className="w-full h-auto object-contain rounded cursor-pointer hover:opacity-95 transition"
                          onClick={() => setZoomImage(currentQ.stimulusImage)}
                          onError={(e) => {
                            e.target.style.display = "none";
                          }}
                        />
                        <p className="text-center text-xs text-slate-400 mt-1 italic">Klik gambar untuk memperbesar</p>
                      </div>
                    )}

                    <div className={`reading-font whitespace-pre-line text-slate-800 leading-relaxed ${fontSizeClass}`}>
                      {currentQ.stimulus}
                    </div>
                  </div>

                  {/* PANEL KANAN: TABEL SPESIFIKASI & LEMBAR SOAL */}
                  <div className="lg:col-span-5 space-y-4">
                    {/* TABEL SPESIFIKASI PUSMENDIK */}
                    <div className="bg-slate-100 rounded-xl p-3.5 border border-slate-200 text-xs text-slate-700 shadow-inner">
                      <table className="w-full text-left">
                        <tbody>
                          <tr className="border-b border-slate-200/70">
                            <td className="py-1 font-semibold text-slate-500 w-32">No Soal</td>
                            <td className="py-1 font-bold text-slate-900">{currentQ.noSoal}</td>
                          </tr>
                          <tr className="border-b border-slate-200/70">
                            <td className="py-1 font-semibold text-slate-500">Kompetensi</td>
                            <td className="py-1 font-bold text-slate-900">{currentQ.kompetensi}</td>
                          </tr>
                          <tr className="border-b border-slate-200/70">
                            <td className="py-1 font-semibold text-slate-500">Sub Kompetensi</td>
                            <td className="py-1 text-slate-800 leading-tight">{currentQ.subKompetensi}</td>
                          </tr>
                          <tr>
                            <td className="py-1 font-semibold text-slate-500">Bentuk Soal</td>
                            <td className="py-1 font-bold text-blue-700">{currentQ.bentukSoal}</td>
                          </tr>
                        </tbody>
                      </table>
                    </div>

                    {/* SOAL & PILIHAN INTERAKTIF */}
                    <div className="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm space-y-5">
                      <div 
                        className={`font-semibold text-slate-900 leading-relaxed ${fontSizeClass}`}
                        dangerouslySetInnerHTML={{ __html: currentQ.question }}
                      />

                      {/* Tipe 1: Pilihan Ganda Tunggal (PG) */}
                      {currentQ.type === "single" && (
                        <div className="space-y-3">
                          {currentQ.options.map((opt, idx) => {
                            const isSelected = userAnswers[currentQ.id] === idx;
                            const optImg = currentQ.optionImages && currentQ.optionImages[idx];
                            return (
                              <div
                                key={idx}
                                onClick={() => handleSingleSelect(currentQ.id, idx)}
                                className={`flex items-start gap-3 p-3.5 rounded-xl border-2 cursor-pointer transition-all ${
                                  isSelected
                                    ? "border-blue-600 bg-blue-50/60 shadow-sm"
                                    : "border-slate-200 hover:border-slate-300 hover:bg-slate-50"
                                }`}
                              >
                                <span className={`w-7 h-7 flex-shrink-0 flex items-center justify-center font-bold text-xs rounded-lg ${
                                  isSelected ? "bg-blue-600 text-white" : "bg-slate-100 text-slate-700"
                                }`}>
                                  {String.fromCharCode(65 + idx)}
                                </span>
                                <div className="flex-1 space-y-2">
                                  {optImg && (
                                    <div className="rounded-lg overflow-hidden border border-slate-200 bg-white p-2 max-w-sm">
                                      <img 
                                        src={optImg} 
                                        alt={`Pilihan ${String.fromCharCode(65 + idx)}`} 
                                        className="w-full h-auto object-contain cursor-pointer hover:scale-105 transition"
                                        onClick={(e) => { e.stopPropagation(); setZoomImage(optImg); }}
                                        onError={(e) => { e.target.style.display = "none"; }}
                                      />
                                    </div>
                                  )}
                                  <div className={`text-slate-800 leading-relaxed ${fontSizeClass}`} dangerouslySetInnerHTML={{ __html: opt }} />
                                </div>
                              </div>
                            );
                          })}
                        </div>
                      )}

                      {/* Tipe 2: PGK MCMA (Jawaban Lebih dari Satu) */}
                      {currentQ.type === "mcma" && (
                        <div className="space-y-3">
                          {currentQ.options.map((opt, idx) => {
                            const isChecked = Array.isArray(userAnswers[currentQ.id]) && userAnswers[currentQ.id].includes(idx);
                            return (
                              <div
                                key={idx}
                                onClick={() => handleMcmaToggle(currentQ.id, idx)}
                                className={`flex items-start gap-3 p-3.5 rounded-xl border-2 cursor-pointer transition-all ${
                                  isChecked
                                    ? "border-indigo-600 bg-indigo-50/60 shadow-sm"
                                    : "border-slate-200 hover:border-slate-300 hover:bg-slate-50"
                                }`}
                              >
                                <div className={`w-5 h-5 mt-0.5 rounded flex items-center justify-center border ${
                                  isChecked ? "bg-indigo-600 border-indigo-600 text-white" : "border-slate-300 bg-white"
                                }`}>
                                  {isChecked && (
                                    <svg className="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                      <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path>
                                    </svg>
                                  )}
                                </div>
                                <div className={`text-slate-800 leading-relaxed flex-1 ${fontSizeClass}`} dangerouslySetInnerHTML={{ __html: opt }} />
                              </div>
                            );
                          })}
                        </div>
                      )}

                      {/* Tipe 3: PGK Kategori Matriks (Benar/Salah) */}
                      {currentQ.type === "matrix" && (
                        <div className="overflow-x-auto border border-slate-200 rounded-xl">
                          <table className="w-full text-left text-xs sm:text-sm">
                            <thead className="bg-slate-100 text-slate-700 font-bold border-b border-slate-200">
                              <tr>
                                <th className="p-3">#</th>
                                <th className="p-3">Pernyataan</th>
                                {currentQ.matrixColumns.map((col, cIdx) => (
                                  <th key={cIdx} className="p-3 text-center w-24">{col}</th>
                                ))}
                              </tr>
                            </thead>
                            <tbody className="divide-y divide-slate-100">
                              {currentQ.statements.map((stmt, sIdx) => (
                                <tr key={sIdx} className="hover:bg-slate-50/50">
                                  <td className="p-3 font-bold text-slate-500 align-top">{String.fromCharCode(65 + sIdx)}.</td>
                                  <td className="p-3 text-slate-800 align-top" dangerouslySetInnerHTML={{ __html: stmt }} />
                                  {currentQ.matrixColumns.map((col, cIdx) => {
                                    const isChosen = Array.isArray(userAnswers[currentQ.id]) && userAnswers[currentQ.id][sIdx] === col;
                                    return (
                                      <td key={cIdx} className="p-3 text-center align-middle">
                                        <input
                                          type="radio"
                                          name={`matrix-${currentQ.id}-${sIdx}`}
                                          checked={isChosen}
                                          onChange={() => handleMatrixSelect(currentQ.id, sIdx, col)}
                                          className="w-4 h-4 text-blue-600 focus:ring-blue-500 cursor-pointer"
                                        />
                                      </td>
                                    );
                                  })}
                                </tr>
                              ))}
                            </tbody>
                          </table>
                        </div>
                      )}
                    </div>

                    {/* Navigasi Soal Bawah */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm flex items-center justify-between">
                      <button
                        disabled={currentIndex === 0}
                        onClick={() => setCurrentIndex(prev => prev - 1)}
                        className={`px-4 py-2 rounded-xl text-xs font-bold transition ${
                          currentIndex === 0
                            ? "bg-slate-100 text-slate-400 cursor-not-allowed"
                            : "bg-slate-100 hover:bg-slate-200 text-slate-800"
                        }`}
                      >
                        ← Sebelumnya
                      </button>

                      <div className="text-xs font-bold text-slate-500">
                        Soal {currentIndex + 1} / {activeQuestions.length}
                      </div>

                      {currentIndex < activeQuestions.length - 1 ? (
                        <button
                          onClick={() => setCurrentIndex(prev => prev + 1)}
                          className="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded-xl text-xs font-bold shadow transition"
                        >
                          Selanjutnya →
                        </button>
                      ) : (
                        <button
                          onClick={() => {
                            if (window.confirm("Apakah Anda yakin ingin menyelesaikan tes dan melihat hasil pembahasan?")) {
                              setCurrentTab("result");
                            }
                          }}
                          className="px-4 py-2 bg-emerald-600 hover:bg-emerald-700 text-white rounded-xl text-xs font-bold shadow-md transition"
                        >
                          Selesaikan Tes ✓
                        </button>
                      )}
                    </div>

                    {/* Palet Nomor Soal */}
                    <div className="bg-white p-4 rounded-2xl border border-slate-200 shadow-sm space-y-3">
                      <h4 className="font-bold text-xs text-slate-500 uppercase tracking-wider">Daftar Nomor Soal</h4>
                      <div className="grid grid-cols-7 gap-2">
                        {activeQuestions.map((q, idx) => {
                          const isAnswered = userAnswers[q.id] !== undefined;
                          const isCurrent = currentIndex === idx;
                          const isFlag = flagged[q.id];

                          let badgeColor = "bg-slate-100 text-slate-700 border-slate-200";
                          if (isFlag) badgeColor = "bg-amber-400 text-slate-900 border-amber-500 font-black";
                          else if (isAnswered) badgeColor = "bg-blue-600 text-white border-blue-600 font-bold";

                          return (
                            <button
                              key={idx}
                              onClick={() => setCurrentIndex(idx)}
                              className={`h-9 rounded-lg text-xs border flex items-center justify-center transition-all ${badgeColor} ${
                                isCurrent ? "ring-2 ring-blue-500 ring-offset-2 scale-105" : ""
                              }`}
                            >
                              {idx + 1}
                            </button>
                          );
                        })}
                      </div>
                    </div>
                  </div>
                </div>
              </div>
            )}

            {/* TAB 5: LEMBAR HASIL & PEMBAHASAN */}
            {currentTab === "result" && (
              <div className="space-y-6 animate-fadeIn">
                <div className="bg-white rounded-3xl p-6 sm:p-10 border border-slate-200 shadow-sm text-center space-y-4">
                  <div className="w-20 h-20 mx-auto rounded-full bg-blue-50 text-blue-600 flex items-center justify-center font-black text-3xl shadow-inner">
                    {scoreCalculation.totalScore}
                  </div>
                  <h2 className="text-2xl sm:text-3xl font-black text-slate-900">Hasil Evaluasi Tes Anda</h2>
                  <p className="text-sm text-slate-600 max-w-md mx-auto">
                    Anda berhasil menjawab benar <strong>{scoreCalculation.correctCount}</strong> dari total <strong>{scoreCalculation.total}</strong> butir soal.
                  </p>
                  <div className="pt-2 flex justify-center gap-3">
                    <button
                      onClick={() => setCurrentTab(examMode === "penilaian" ? "penilaian" : "latihan")}
                      className="px-5 py-2.5 bg-blue-600 text-white font-bold text-xs rounded-xl shadow hover:bg-blue-700 transition"
                    >
                      Kembali ke Menu Utama
                    </button>
                  </div>
                </div>

                {/* Tinjauan Pembahasan Tiap Nomor */}
                <div className="space-y-4">
                  <h3 className="font-extrabold text-slate-900 text-lg">Tinjauan dan Pembahasan Lengkap</h3>
                  
                  {activeQuestions.map((q, idx) => {
                    const ans = userAnswers[q.id];
                    let isCorrect = false;

                    if (q.type === "single") {
                      isCorrect = ans === q.correctAnswer;
                    } else if (q.type === "mcma") {
                      if (Array.isArray(ans) && Array.isArray(q.correctAnswer)) {
                        isCorrect = ans.length === q.correctAnswer.length && ans.every((v, i) => v === q.correctAnswer[i]);
                      }
                    } else if (q.type === "matrix") {
                      if (Array.isArray(ans) && Array.isArray(q.correctAnswer)) {
                        isCorrect = q.statements.every((_, i) => ans[i] === q.correctAnswer[i]);
                      }
                    }

                    return (
                      <div key={idx} className="bg-white rounded-2xl p-5 sm:p-6 border border-slate-200 shadow-sm space-y-4">
                        <div className="flex items-center justify-between border-b border-slate-100 pb-3">
                          <span className="text-xs font-bold px-2.5 py-1 rounded bg-slate-100 text-slate-700">
                            Soal Nomor {q.noSoal}
                          </span>
                          <span className={`text-xs font-extrabold px-2.5 py-1 rounded ${
                            isCorrect ? "bg-emerald-100 text-emerald-800" : "bg-rose-100 text-rose-800"
                          }`}>
                            {isCorrect ? "Jawaban Anda Benar ✓" : "Jawaban Anda Salah ✕"}
                          </span>
                        </div>

                        <div className="text-xs text-slate-500">
                          <strong>Kompetensi:</strong> {q.kompetensi} | <strong>Bentuk:</strong> {q.bentukSoal}
                        </div>

                        <div className="font-semibold text-slate-900 text-sm" dangerouslySetInnerHTML={{ __html: q.question }} />

                        {/* Penjelasan Kunci Jawaban */}
                        <div className="p-4 bg-blue-50/70 border-l-4 border-blue-600 rounded-lg space-y-1">
                          <h5 className="font-bold text-xs text-blue-900">Pembahasan Resmi:</h5>
                          <p className="text-xs sm:text-sm text-blue-800 leading-relaxed">{q.explanation}</p>
                        </div>
                      </div>
                    );
                  })}
                </div>
              </div>
            )}
          </main>

          {/* MODAL ZOOM GAMBAR */}
          {zoomImage && (
            <div 
              className="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm flex items-center justify-center p-4 cursor-zoom-out"
              onClick={() => setZoomImage(null)}
            >
              <div className="max-w-4xl max-h-[90vh] bg-white p-3 rounded-2xl shadow-2xl overflow-hidden relative">
                <button
                  onClick={() => setZoomImage(null)}
                  className="absolute top-4 right-4 bg-slate-900/80 text-white rounded-full w-8 h-8 flex items-center justify-center font-bold text-sm"
                >
                  ✕
                </button>
                <img src={zoomImage} alt="Perbesar Gambar" className="w-full h-auto max-h-[85vh] object-contain rounded-xl" />
              </div>
            </div>
          )}

          {/* FOOTER */}
          <footer className="border-t border-slate-200 bg-white py-6 text-center text-xs text-slate-500 mt-12">
            <p>© 2026 Materi & Soal TKA Bahasa Indonesia SMA/SMK. Sesuai Standar Pusmendik Kemendikdasmen & KBBI.</p>
          </footer>
        </div>
      );
    }

    ReactDOM.createRoot(document.getElementById("root")).render(<App />);
  </script>
</body>
</html>
