                contextText: `“E...gurumu itu orang desa ini juga. Pasti tahu bahwa saat ini musim <i>maddongi</i> (mengusir burung saat buah padi mulai menguning). Besok kau menghadap, sampaikan bahwa kau membantu Ayah di sawah. Nah, pasti gurumu mengerti mengapa kamu tidak ke sekolah.”\nAku terpana. Jawaban Ayah benar-benar membuatku hampir menangis histeris. Bagaimana tidak. Lomba semakin dekat, sementara masih banyak materi yang belum aku paham. Terbayang aku akan hancur dan tidak bisa bersaing dengan siswa sekolah lain. Ingin rasanya aku berteriak agar Ayahku tahu bagaimana kacaunya pikiranku. Namun, aku sadar bahwa ini adalah perbuatan yang tidak akan menyelesaikan masalah. Malah akan semakin membuat Ayahku geram. Otakku terus berpikir untuk mencari solusi terbaik. Sambil berjalan mengikuti Ayah dari belakang, aku mulai menyusun strategi. “Bagaimana kalau aku ke rumah <i>iyye-ku</i> (nenek), menyampaikan masalahku ini. Ya, hanya dia yang mampu menundukkan Ayah.”\nEsok harinya, sepulang sekolah, kuayunkan sepedaku menuju rumah <i>iyye-ku</i>.\n“Kenapa kamu lesu?” <i>Iyye</i> menanyakan keadaanku. Aku pun menceritakan semuanya kepada <i>iyye</i>.\n“Ya sudah, tidak usah sedih. Nanti kusampaikan pada ayahmu. Kau ke dalam, makan dulu, baru pulang,” ujar <i>iyye-ku</i>.\n    (<i>Piala di Atas Dangau</i>, Muhammad Isrul, dengan penyesuaian)`,

                bentukSoal: "Pilihan Ganda (PG)",
                subMateriId: 'sub2',
                contextTitle: "Teks untuk soal nomor 8 s.d. 10",
                contextText: `<b>Teks 1</b>\nRhodamin B adalah zat pewarna yang tersedia di pasar untuk industri tekstil. Zat ini sering disalahgunakan sebagai zat pewarna makanan dan kosmetik di berbagai negara. Jenis makanan yang mengandung Rhodamin B di antaranya kerupuk, terasi, dan makanan ringan. Zat ini juga banyak ditemukan pada kembang gula, sirup, manisan, dawet, bubur, ikan asap, dan cendol. Tampilan makanan yang menggunakan zat ini cenderung menarik dan terkesan menawarkan cita rasa tinggi sehingga ketika harga jualnya tidak semahal tampilannya, banyak yang tertarik untuk membeli dan mengonsumsinya. Zat ini paling berbahaya bila dikonsumsi karena menyebabkan gangguan pada fungsi hati, bahkan kanker hati. Apabila mengonsumsi makanan yang mengandung Rhodamin B, dalam tubuh akan terjadi penumpukan lemak sehingga lama-kelamaan jumlahnya akan terus bertambah. Dampaknya baru akan kelihatan setelah puluhan tahun kemudian. Jika sudah masuk dalam tubuh, akan mengendap pada jaringan hati dan lemak, tidak dapat dikeluarkan, dan dalam jangka waktu lama bisa bersifat karsinogenik.\n\n<b>Teks 2</b>\nRhodamin B berbentuk serbuk kristal, berwarna hijau atau ungu kemerahan, tidak berbau, dan dalam larutan akan berwarna merah terang berpendar atau berfluoresensi. Rhodamin B merupakan zat warna golongan <i>xanthenes dyes</i>, dan digunakan pada industri tekstil dan kertas, sebagai pewarna kain, kosmetika, produk pembersih mulut, dan sabun. Rhodamin B memiliki berbagai nama lain, antara lain: Tetra ethyl rhodamin; Rheoninine B, D, & C; Red No. 19; Food Red 15; ADC Rhodamine B; Aizen Rhodamine; dan Brilliant Pink B. Rhodamin B mengandung senyawa klorin (Cl) yang merupakan senyawa halogen yang berbahaya dan reaktif. Jika tertelan, senyawa ini akan berusaha mencapai kestabilan dalam tubuh dengan cara mengikat senyawa lain dalam tubuh. Mengonsumsi bahan pangan yang mengandung Rhodamin B dalam jangka panjang dapat terakumulasi di dalam tubuh dan dapat menyebabkan gejala pembesaran hati dan ginjal, gangguan fungsi hati, kerusakan hati, gangguan fisiologis tubuh, bahkan dapat menyebabkan timbulnya kanker hati.`,

                bentukSoal: "Pilihan Ganda (PG)",
                subMateriId: 'sub1',
                contextTitle: "Dampak Ekonomi Digital terhadap Pertumbuhan Usaha Kecil dan Menengah (UKM)",
                contextText: `Ekonomi digital telah membawa perubahan besar dalam berbagai aspek bisnis, terutama bagi Usaha Kecil dan Menengah (UKM). Dengan adanya teknologi digital, UKM kini memiliki peluang lebih besar untuk berkembang dan bersaing di pasar yang lebih luas. Transformasi ini didorong oleh beberapa faktor utama, seperti perkembangan <i>e-commerce</i>, sistem pembayaran digital, pemasaran berbasis data, serta pemanfaatan teknologi berbasis kecerdasan buatan (<i>artificial intelligence</i>).\nSalah satu perubahan signifikan dalam ekonomi digital adalah kemudahan akses ke platform <i>e-commerce</i>. UKM yang sebelumnya hanya mengandalkan toko fisik kini dapat menjual produknya melalui berbagai <i>marketplace</i> daring. Hal ini memungkinkan mereka menjangkau konsumen di luar wilayah lokal, bahkan hingga ke pasar internasional. Dengan biaya operasional yang lebih rendah dibandingkan toko fisik, UKM dapat mengalokasikan dana untuk inovasi dan peningkatan kualitas produk. Selain itu, sistem pengiriman yang semakin efisien memungkinkan UKM memenuhi pesanan dengan lebih cepat dan tepat waktu.\nSelain akses pasar yang lebih luas, sistem pembayaran digital juga telah meningkatkan efisiensi transaksi keuangan. Penggunaan dompet digital dan pembayaran nontunai tidak hanya mempermudah konsumen dalam berbelanja, tetapi juga membantu UKM dalam mencatat keuangan secara lebih akurat. Keuntungan lain dari ekonomi digital adalah strategi pemasaran berbasis data. Melalui analisis data pelanggan, UKM dapat memahami tren pasar dan perilaku konsumen dengan lebih baik. Misalnya, penggunaan iklan digital yang ditargetkan memungkinkan UKM menjangkau segmen pasar yang lebih spesifik sehingga efektivitas promosi meningkat.\nMeskipun menawarkan banyak manfaat, transformasi digital juga menghadirkan tantangan. UKM harus mampu beradaptasi dengan perkembangan teknologi dan meningkatkan literasi digital agar tetap kompetitif. Selain itu, keamanan data menjadi aspek penting yang harus diperhatikan dalam menjalankan bisnis secara digital untuk menghindari risiko peretasan dan penyalahgunaan informasi pelanggan. Dengan segala peluang dan tantangannya, ekonomi digital telah menjadi faktor kunci dalam mendorong pertumbuhan UKM. Jika dikelola dengan baik, digitalisasi dapat menjadi pendorong utama bagi keberlanjutan dan daya saing usaha kecil di era modern ini.\n(Sumber: Kementerian Koperasi dan UKM Republik Indonesia)`,

            {
                id: 12,

                kompetensi: "Pemahaman Inferensial",
                subKompetensi: "Menjelaskan hubungan makna antarkalimat dan/atau antarparagraf dalam teks",
                bentukSoal: "PGK Kategori",
                subMateriId: 'sub2',
                contextTitle: "Dampak Ekonomi Digital terhadap Pertumbuhan Usaha Kecil dan Menengah (UKM)",
                contextText: `Ekonomi digital telah membawa perubahan besar dalam berbagai aspek bisnis, terutama bagi Usaha Kecil dan Menengah (UKM). Dengan adanya teknologi digital, UKM kini memiliki peluang lebih besar untuk berkembang dan bersaing di pasar yang lebih luas. Transformasi ini didorong oleh beberapa faktor utama, seperti perkembangan <i>e-commerce</i>, sistem pembayaran digital, pemasaran berbasis data, serta pemanfaatan teknologi berbasis kecerdasan buatan (<i>artificial intelligence</i>).\nSalah satu perubahan signifikan dalam ekonomi digital adalah kemudahan akses ke platform <i>e-commerce</i>. UKM yang sebelumnya hanya mengandalkan toko fisik kini dapat menjual produknya melalui berbagai <i>marketplace</i> daring. Hal ini memungkinkan mereka menjangkau konsumen di luar wilayah lokal, bahkan hingga ke pasar internasional. Dengan biaya operasional yang lebih rendah dibandingkan toko fisik, UKM dapat mengalokasikan dana untuk inovasi dan peningkatan kualitas produk. Selain itu, sistem pengiriman yang semakin efisien memungkinkan UKM memenuhi pesanan dengan lebih cepat dan tepat waktu.\nSelain akses pasar yang lebih luas, sistem pembayaran digital juga telah meningkatkan efisiensi transaksi keuangan. Penggunaan dompet digital dan pembayaran nontunai tidak hanya mempermudah konsumen dalam berbelanja, tetapi juga membantu UKM dalam mencatat keuangan secara lebih akurat. Keuntungan lain dari ekonomi digital adalah strategi pemasaran berbasis data. Melalui analisis data pelanggan, UKM dapat memahami tren pasar dan perilaku konsumen dengan lebih baik. Misalnya, penggunaan iklan digital yang ditargetkan memungkinkan UKM menjangkau segmen pasar yang lebih spesifik sehingga efektivitas promosi meningkat.\nMeskipun menawarkan banyak manfaat, transformasi digital juga menghadirkan tantangan. UKM harus mampu beradaptasi dengan perkembangan teknologi dan meningkatkan literasi digital agar tetap kompetitif. Selain itu, keamanan data menjadi aspek penting yang harus diperhatikan dalam menjalankan bisnis secara digital untuk menghindari risiko peretasan dan penyalahgunaan informasi pelanggan. Dengan segala peluang dan tantangannya, ekonomi digital telah menjadi faktor kunci dalam mendorong pertumbuhan UKM. Jika dikelola dengan baik, digitalisasi dapat menjadi pendorong utama bagi keberlanjutan dan daya saing usaha kecil di era modern ini.\n(Sumber: Kementerian Koperasi dan UKM Republik Indonesia)`,
                question: "Bagaimana pola pengembangan paragraf ke-1, ke-2, dan ke-3 pada teks tersebut?<br><span class='text-xs text-brand-600 dark:text-brand-400 font-normal italic'>Tentukan Benar atau Salah untuk setiap pernyataan berdasarkan isi teks!</span>",

                ],

                subKompetensi: "Mengidentifikasi penggunaan kata serapan dari bahasa daerah/asing dalam berbagai bidang",
                bentukSoal: "Pilihan Ganda (PG)",
                subMateriId: 'sub1',
                contextTitle: "Kutipan Cerpen Seragam karya Aris Kurniawan Basuki",
                contextText: `Hampir 25 tahun lalu kami berpisah karena keluarga saya harus boyongan ke kota tempat kerja Ayah yang baru di luar pulau. Tak satupun barang tertinggal di rumah lama. Begitu juga dengan sahabatku, kami harus berpisah.\nBertemu dengannya setelah sekian lama, mengingatkan kembali pada pengalaman kami dahulu. Pengalaman yang menjadikan dia, walau tidak setiap waktu, selalu lekat di ingatan saya. Tentu dia mengingatnya pula, bahkan saya yakin rasa yang diidapnya lebih besar efeknya. Karena sebagai seorang sahabat, dia jelas jauh lebih tulus dan setia daripada saya. Tak terasa mata saya mulai berkaca-kaca.\nSaat malam itu saya berada di sini, memperhatikannya belajar. Selesai belajar, dia menyuruh saya pulang karena hendak pergi mencari jangkrik. Saya langsung menyatakan ingin ikut, tapi dia keberatan. Ayah dan ibunya pun melarang. Saya sering mendengar cerita mengasyikan anak-anak beramai-ramai berangkat ke sawah selepas isya untuk mencari jangkrik. Sayang, Ayah tidak pernah membolehkan saya. Tapi malam itu saya nekat dan sahabat saya itu akhirnya tidak kuasa menolak. ”Tidak ganti baju?” tanya saya heran begitu dia langsung memimpin untuk berangkat. Itu hari Jumat. Seragam coklat Pramuka yang dikenakannya sejak pagi masih akan terpakai untuk bersekolah sehari lagi. Dia memang tidak memiliki banyak pakaian hingga seragam sekolah biasa dipakai kapan saja. Tapi memakainya untuk pergi ke sawah mencari jangkrik, rasanya sangat tidak elok.\nSaya mengambil alih obor dari tangannya. Rasanya belum terlalu lama kami berada di sana dan bumbung baru terisi beberapa ekor jangkrik ketika tiba-tiba angin berubah perangai. Kaget, pantat obor itu justru saya angkat tinggi-tinggi sehingga minyak mendorong sumbunya terlepas. Api dengan cepat berpindah membakar punggung saya! Terdengar teriakannya sembari melepaskan seragam coklatnya untuk dipakai menyabet punggung saya. Baju yang saya kenakan habis sepertiganya. Sahabat saya itu tanggap melingkupi tubuh saya dengan seragam coklatnya melihat saya mulai menangis dan menggigil antara kesakitan dan kedinginan. Sadar saya membutuhkan pertolongan secepatnya, dia menggendong saya lalu berlari sembari membujuk-bujuk saya untuk tetap tenang. Napasnya memburu kelelahan, tapi rasa tanggung jawab yang besar seperti memberinya kekuatan berlipat untuk tetap bersama saya.\n(Kutipan Cerpen <i>Seragam</i> karya Aris Kurniawan Basuki dengan penyesuaian)`,

                                                            <div className="absolute inset-0 bg-black/40 opacity-0 group-hover:opacity-100 transition-opacity flex items-center justify-center rounded-lg text-white font-medium text-xs">
                                                                Klik untuk Memperbesar Gambar
                                                            </div>
                                                        </div>
                                                        <p className="text-[11px] text-center text-slate-500 mt-2">
                                                            *Gambar dimuat dari repository GitHub (`{currentQ.imageName || 'soal-11-a.png'}`)
                                                        </p>
                                                    </div>
                                                )}
                                            </div>
                                        </div>

                                        {/* RIGHT COLUMN: QUESTION & INTERACTIVE OPTIONS */}
                                        <div className="lg:col-span-6 flex flex-col justify-between space-y-4">
                                            
                                            {/* QUESTION PANEL */}
                                            <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 shadow-sm p-5 lg:p-6 flex-1 flex flex-col overflow-y-auto custom-scrollbar">
                                                <div className="flex items-center justify-between mb-4">
                                                    <span className="text-[11px] font-bold uppercase tracking-wider bg-brand-50 text-brand-700 dark:bg-brand-950/50 dark:text-brand-300 px-3 py-1 rounded-full border border-brand-200 dark:border-brand-800">
                                                        Pertanyaan No. {currentIndex + 1} • {currentQ.bentukSoal}
                                                    </span>

                                                    {/* Doubt Checkbox */}
                                                    <label className="flex items-center space-x-2 cursor-pointer select-none">
                                                        <input 
                                                            type="checkbox" 
                                                            checked={!!doubtStatus[currentQ.id]} 
                                                            onChange={toggleDoubt}
                                                            className="w-4 h-4 text-amber-500 rounded border-slate-300 focus:ring-amber-400"
                                                        />
                                                        <span className="text-xs font-semibold text-amber-600 dark:text-amber-400">Ragu-Ragu</span>
                                                    </label>
                                                </div>

                                                <h3 className={`font-semibold text-slate-800 dark:text-slate-100 mb-6 leading-normal ${fontSize}`} dangerouslySetInnerHTML={{ __html: currentQ.question }}></h3>

                                                {/* MULTIPLE CHOICE TYPES */}
                                                
                                                {/* TYPE 1: STANDARD SINGLE CHOICE PG */}
                                                {currentQ.bentukSoal === "Pilihan Ganda (PG)" && (
                                                    <div className="space-y-3 flex-1">
                                                        {currentQ.options.map((opt, optIndex) => {
                                                            const isSelected = userAnswers[currentQ.id] === optIndex;
                                                            const optionLetter = String.fromCharCode(65 + optIndex);

                                                            return (
                                                                <button
                                                                    key={optIndex}
                                                                    onClick={() => handleSelectPG(optIndex)}
                                                                    className={`w-full text-left p-4 rounded-xl border transition-all flex items-start space-x-3 group ${
                                                                        isSelected 
                                                                            ? 'border-brand-600 bg-brand-50/80 dark:bg-brand-950/40 text-brand-900 dark:text-brand-100 ring-2 ring-brand-500/20' 
                                                                            : 'border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200'
                                                                    }`}
                                                                >
                                                                    <span className={`w-7 h-7 rounded-lg text-xs font-bold flex items-center justify-center shrink-0 transition-colors ${
                                                                        isSelected 
                                                                            ? 'bg-brand-600 text-white' 
                                                                            : 'bg-slate-100 dark:bg-slate-700 text-slate-600 dark:text-slate-300 group-hover:bg-slate-200'
                                                                    }`}>
                                                                        {optionLetter}
                                                                    </span>
                                                                    <div className="flex-1">
                                                                        <span className={`${fontSize} leading-snug`} dangerouslySetInnerHTML={{ __html: opt }}></span>
                                                                        {currentQ.optionImages && currentQ.optionImages[optIndex] && (
                                                                            <img 
                                                                                src={`${githubImageBase}${currentQ.optionImages[optIndex]}`} 
                                                                                alt={`Bagan ${optionLetter}`} 
                                                                                className="mt-2 max-h-40 object-contain rounded-lg border border-slate-200 dark:border-slate-700" 
                                                                                onError={(e) => { e.target.style.display = 'none'; }}
                                                                            />
                                                                        )}
                                                                    </div>
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                )}

                                                {/* TYPE 2: MULTIPLE CHOICE MULTIPLE ANSWER (PGK MCMA) */}
                                                {currentQ.bentukSoal === "PGK MCMA" && (
                                                    <div className="space-y-3 flex-1">
                                                        {currentQ.options.map((opt, optIndex) => {
                                                            const userAnsArr = Array.isArray(userAnswers[currentQ.id]) ? userAnswers[currentQ.id] : [];
                                                            const isSelected = userAnsArr.includes(optIndex);
                                                            const optionLetter = String.fromCharCode(65 + optIndex);

                                                            return (
                                                                <button
                                                                    key={optIndex}
                                                                    onClick={() => handleSelectMCMA(optIndex)}
                                                                    className={`w-full text-left p-4 rounded-xl border transition-all flex items-start space-x-3 group ${
                                                                        isSelected 
                                                                            ? 'border-brand-600 bg-brand-50/80 dark:bg-brand-950/40 text-brand-900 dark:text-brand-100 ring-2 ring-brand-500/20' 
                                                                            : 'border-slate-200 dark:border-slate-700 hover:border-slate-300 dark:hover:border-slate-600 bg-white dark:bg-slate-800 text-slate-700 dark:text-slate-200'
                                                                    }`}
                                                                >
                                                                    <div className={`w-6 h-6 rounded-md border flex items-center justify-center shrink-0 mt-0.5 transition-colors ${
                                                                        isSelected ? 'bg-brand-600 border-brand-600 text-white' : 'border-slate-300 dark:border-slate-600 bg-slate-50 dark:bg-slate-700'
                                                                    }`}>
                                                                        {isSelected && (
                                                                            <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="3" d="M5 13l4 4L19 7"></path></svg>
                                                                        )}
                                                                    </div>
                                                                    <span className={`font-bold shrink-0 ${fontSize}`}>{optionLetter}.</span>
                                                                    <span className={`flex-1 ${fontSize} leading-snug`} dangerouslySetInnerHTML={{ __html: opt }}></span>
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                )}

                                                {/* TYPE 3: CATEGORY MATRIX (PGK Kategori) */}
                                                {currentQ.bentukSoal === "PGK Kategori" && (
                                                    <div className="overflow-x-auto rounded-xl border border-slate-200 dark:border-slate-700">
                                                        <table className="w-full text-left text-xs sm:text-sm">
                                                            <thead className="bg-slate-100 dark:bg-slate-750 text-slate-700 dark:text-slate-300 border-b border-slate-200 dark:border-slate-700">
                                                                <tr>
                                                                    <th className="p-3 w-10 text-center">#</th>
                                                                    <th className="p-3">Pernyataan</th>
                                                                    {currentQ.categories.map((cat, cIdx) => (
                                                                        <th key={cIdx} className="p-3 text-center w-24 sm:w-28">{cat}</th>
                                                                    ))}
                                                                </tr>
                                                            </thead>
                                                            <tbody className="divide-y divide-slate-100 dark:divide-slate-700">
                                                                {currentQ.statements.map((st) => {
                                                                    const userChoice = (typeof userAnswers[currentQ.id] === 'object' && !Array.isArray(userAnswers[currentQ.id]))
                                                                        ? userAnswers[currentQ.id][st.id]
                                                                        : undefined;

                                                                    return (
                                                                        <tr key={st.id} className="hover:bg-slate-50 dark:hover:bg-slate-900/40">
                                                                            <td className="p-3 text-center font-bold">{st.id}.</td>
                                                                            <td className="p-3 leading-relaxed" dangerouslySetInnerHTML={{ __html: st.text }}></td>
                                                                            {currentQ.categories.map((cat, cIdx) => {
                                                                                const isChecked = userChoice === cat;
                                                                                return (
                                                                                    <td key={cIdx} className="p-3 text-center">
                                                                                        <button
                                                                                            onClick={() => handleSelectCategory(st.id, cat)}
                                                                                            className={`w-7 h-7 sm:w-8 sm:h-8 rounded-full border inline-flex items-center justify-center font-bold text-xs transition-all ${
                                                                                                isChecked 
                                                                                                    ? 'bg-brand-600 border-brand-600 text-white shadow ring-2 ring-brand-500/20' 
                                                                                                    : 'border-slate-300 dark:border-slate-600 hover:bg-slate-100 dark:hover:bg-slate-700 text-transparent'
                                                                                            }`}
                                                                                        >
                                                                                            ✓
                                                                                        </button>
                                                                                    </td>
                                                                                );
                                                                            })}
                                                                        </tr>
                                                                    );
                                                                })}
                                                            </tbody>
                                                        </table>
                                                    </div>
                                                )}

                                            </div>

                                            {/* NAVIGATION & CONTROLS PANEL */}
                                            <div className="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 p-4 shadow-sm flex flex-col space-y-4">
                                                
                                                {/* QUESTION MAP GRID */}
                                                <div>
                                                    <div className="text-xs font-semibold text-slate-500 mb-2 flex justify-between items-center">
                                                        <span>Peta Navigasi Soal (20 Soal)</span>
                                                        <span className="text-[10px] text-slate-400">Hijau: Terjawab | Kuning: Ragu</span>
                                                    </div>
                                                    <div className="grid grid-cols-5 sm:grid-cols-10 gap-2">
                                                        {activeExamQuestions.map((q, idx) => {
                                                            const isAns = isQuestionAnswered(q);
                                                            const isDoubt = doubtStatus[q.id];
                                                            const isCurr = currentIndex === idx;

                                                            let badgeStyle = "bg-slate-100 text-slate-600 border-slate-200 dark:bg-slate-700 dark:text-slate-300 dark:border-slate-600";
                                                            if (isDoubt) {
                                                                badgeStyle = "bg-amber-500 text-white border-amber-600";
                                                            } else if (isAns) {
                                                                badgeStyle = "bg-emerald-600 text-white border-emerald-700";
                                                            }

                                                            return (
                                                                <button
                                                                    key={q.id}
                                                                    onClick={() => setCurrentIndex(idx)}
                                                                    className={`h-9 rounded-lg font-bold text-xs border transition-all flex items-center justify-center relative ${badgeStyle} ${
                                                                        isCurr ? 'ring-2 ring-brand-500 ring-offset-2 dark:ring-offset-slate-800 scale-105' : ''
                                                                    }`}
                                                                >
                                                                    {idx + 1}
                                                                </button>
                                                            );
                                                        })}
                                                    </div>
                                                </div>

                                                {/* BOTTOM NAVIGATION BUTTONS */}
                                                <div className="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-700">
                                                    <button
                                                        disabled={currentIndex === 0}
                                                        onClick={() => setCurrentIndex(currentIndex - 1)}
                                                        className="px-4 py-2 rounded-xl text-xs font-semibold border border-slate-200 dark:border-slate-700 bg-slate-50 dark:bg-slate-700 text-slate-700 dark:text-slate-200 hover:bg-slate-100 disabled:opacity-40 disabled:cursor-not-allowed"
                                                    >
                                                        &larr; Sebelumnya
                                                    </button>

                                                    {currentIndex === activeExamQuestions.length - 1 ? (
                                                        <button
                                                            onClick={() => setShowConfirmModal(true)}
                                                            className="px-5 py-2 rounded-xl text-xs font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-md transition"
                                                        >
                                                            Selesai Latihan
                                                        </button>
                                                    ) : (
                                                        <button
                                                            onClick={() => setCurrentIndex(currentIndex + 1)}
                                                            className="px-5 py-2 rounded-xl text-xs font-bold bg-brand-600 hover:bg-brand-700 text-white shadow-md transition"
                                                        >
                                                            Selanjutnya &rarr;
                                                        </button>
                                                    )}
                                                </div>
                                            </div>
                                        </div>
                                    </main>
                                )}
                            </>
                        )}

                        {/* IMAGE ZOOM MODAL */}
                        {showImageModal && (
                            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4" onClick={() => setShowImageModal(null)}>
                                <div className="relative max-w-4xl w-full bg-white dark:bg-slate-800 rounded-2xl overflow-hidden p-2" onClick={(e) => e.stopPropagation()}>
                                    <button 
                                        onClick={() => setShowImageModal(null)} 
                                        className="absolute top-4 right-4 bg-slate-900/60 text-white p-2 rounded-full hover:bg-slate-900"
                                    >
                                        <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                    <img src={showImageModal} alt="Perbesar Gambar" className="w-full h-auto max-h-[85vh] object-contain rounded-xl" />
                                </div>
                            </div>
                        )}

                        {/* CONFIRM SUBMIT MODAL */}
                        {showConfirmModal && (
                            <div className="fixed inset-0 z-50 bg-black/60 backdrop-blur-sm flex items-center justify-center p-4">
                                <div className="bg-white dark:bg-slate-800 rounded-2xl max-w-md w-full p-6 shadow-2xl border border-slate-200 dark:border-slate-700 text-center">
                                    <div className="w-12 h-12 bg-amber-100 text-amber-600 dark:bg-amber-950 dark:text-amber-400 rounded-full flex items-center justify-center mx-auto mb-4">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-3L13.732 4c-.77-1.333-2.694-1.333-3.464 0L3.34 16c-.77 1.333.192 3 1.732 3z"></path></svg>
                                    </div>
                                    <h3 className="text-lg font-bold text-slate-900 dark:text-white mb-2">Konfirmasi Selesai Latihan</h3>
                                    <p className="text-sm text-slate-500 dark:text-slate-400 mb-6">
                                        Apakah Anda yakin ingin menyelesaikan modul 20 latihan soal ini?
                                    </p>
                                    <div className="flex space-x-3">
                                        <button 
                                            onClick={() => setShowConfirmModal(false)}
                                            className="flex-1 py-2.5 rounded-xl text-sm font-semibold border border-slate-300 dark:border-slate-600 text-slate-700 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700"
                                        >
                                            Batal
                                        </button>
                                        <button 
                                            onClick={handleSubmit}
                                            className="flex-1 py-2.5 rounded-xl text-sm font-bold bg-emerald-600 hover:bg-emerald-700 text-white shadow-md"
                                        >
                                            Ya, Selesai
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* FOOTER */}
                        <footer className="bg-white dark:bg-slate-800 border-t border-slate-200 dark:border-slate-700 py-3 text-center text-xs text-slate-500 dark:text-slate-400">
                            Portal Materi & Soal TKA Bahasa Indonesia • Standar Pusmendik & KBBI • Hak Cipta &copy; {new Date().getFullYear()}
                        </footer>
                    </div>
                </div>
            );
        }

        ReactDOM.createRoot(document.getElementById('root')).render(<App />);
    </script>
</body>
</html>
